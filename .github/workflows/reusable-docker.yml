name: Reusable Docker Workflow

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker image build karo
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:latest .

      - name: Docker Hub pe push karo
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}:latest
