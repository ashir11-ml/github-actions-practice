name: Env aur Secrets Practice

on:
  push:
    branches: [main]

env:
  APP_NAME: github-actions-practice
  ENVIRONMENT: production

jobs:
  practice-job:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Environment variables print karo
        run: |
          echo "App naam: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      - name: Secret safely use karo
        run: |
          echo "Docker username hai: ${{ secrets.ASHIR  }}"
          echo "Password kabhi print nahi hoga: ${{ secrets.PASSWORD }}"
